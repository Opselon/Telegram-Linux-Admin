[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-linux-admin"
version = "3.2.0"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
description = "A modern, post-quantum encrypted Telegram bot for Linux server administration with 2026 standards."
readme = "README.md"
requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Topic :: System :: Systems Administration",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "asyncssh>=2.14",
    "tenacity>=8.2",
    "async-timeout>=4.0",
    "requests>=2.31",
    "cryptography>=42.0",
]

[project.optional-dependencies]
monitoring = [
    "psutil>=5.9",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.setuptools]
# 3.2 split the monolith into subpackages; every src.* package ships.
# The flat ``src/`` layout has no ``src/__init__.py``, so setuptools'
# auto-discovery finds nothing on its own (the pre-3.2 wheel shipped only
# console scripts and the container died with "No module named 'src'").
# Declared explicitly, and 3.2's src.bot / src.runtime / src.observability /
# src.jobs / src.policy subpackages are included with them.
packages = ["src", "src.bot", "src.runtime", "src.observability", "src.jobs", "src.policy"]

[project.scripts]
tla-bot = "src.main:main"
tla-bot-update = "src.updater:main"

# ----------------------------------------------------------------------------
# CI tool configuration (owned by the CI lane, feature/3.2-ci).
# These gates are calibrated to the tree as it exists today, not aspirationally:
# every threshold here was measured locally before being committed.
# ----------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "venv", "build", "dist", ".eggs"]

[tool.ruff.lint]
# Bug-catching rules only. The broad style selections (E/W, I, SIM) fire
# hundreds of times on code that predates this config, which would turn the
# lint gate into a mass-reformat demand on src/** - files this lane does not
# own. What remains catches real bugs.
#
# Known debt, deliberately excluded (see lane-ci-status.md):
#   F401 unused imports: 24 findings, all in src/** (orchestrator-owned).
#   F841 unused variables: 4 findings, all in src/**.
#   B904 raise-without-from and B007 unused loop var: 5 findings in src/main.py.
# Fixing those means editing files this lane must not touch, so the debt is
# reported in the status file rather than hidden by deleting the rule.
select = [
    "F811", # redefinition of unused name (duplicate def/import)
    "F821", # undefined name
    "F822", # undefined name in __all__
    "F823", # local variable referenced before assignment
    "E9",   # syntax errors and invalid Python
    "B",    # flake8-bugbear: real bug patterns
]
# per-file-ignores survive a CLI --select, which is how the wave gate invokes
# ruff: a command-line --select *overrides* this whole `ignore` list, so the
# gate's flags must not turn pre-existing src/tests debt into a CI failure.
# Entries here name the exact findings each file already produces on the base
# commit 2c0aa07, nothing more - a new finding in these files still fails.
[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["F401", "B007", "B904", "ASYNC109", "ASYNC220", "ASYNC230", "ASYNC240"]
"src/updater.py" = ["F401", "B904"]
"src/parse_mode.py" = ["F401"]
"src/logger_config.py" = ["F401"]
"src/ssh_manager.py" = ["ASYNC109"]
"tests/test_bot_commands.py" = ["F401", "ASYNC230"]
"tests/test_bot_e2e.py" = ["F401"]
"tests/test_config_settings.py" = ["F401"]
"tests/test_ssh_layer.py" = ["F401"]

ignore = [
    "E501",  # line-length is a style preference; ruff format handles it
    "F401",  # unused imports: 24 in src/**, orchestrator-owned
    "F841",  # unused variables: 4 in src/**, orchestrator-owned
    "B904",  # raise-without-from: 4 in src/main.py
    "B007",  # unused loop control variable: 1 in src/main.py
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# The CI lane owns only scripts/ci: src/** and tests/** predate this config
# and mass-reformatting them would collide with every other lane's diff. The
# format gate in ci.yml checks scripts/ci only - once src/tests are migrated,
# widen it and this config together.

[tool.mypy]
# Configured to run on the tree as it exists, not aspirationally: the codebase
# predates this config and a strict gate would demand a mass annotation sweep
# of the Telegram handler layer, which this lane does not own. What stays on
# still catches real bugs in unannotated code without false positives.
#
# 3.2 moved the 3.8k-line src/main.py into src/bot/*, so the handler-layer
# findings moved with it: 415 of them now live in the 16 src.bot modules
# (~350 are `update.callback_query` union-attr on Optional PTB attributes) and
# exactly 0 remain outside. src/main.py itself is still excluded because it is
# a pure re-export facade whose names come from `from .bot import *`.
#
# The baseline below is per-module and per-error-code, pinned to what each
# module measures today, and the new src/observability, src/jobs, src/runtime
# and src/policy packages are deliberately NOT listed: they are fully typed and
# green, so any finding there is a real regression and fails the gate. Delete a
# src.bot entry as its module is annotated; after that mypy enforces it again.
python_version = "3.12"
mypy_path = "src"
files = ["src"]
exclude = ["^src/main\\.py$"]

disallow_untyped_defs = false      # opt-in: no mass annotation sweep
check_untyped_defs = true          # still type-check bodies of unannotated defs
ignore_missing_imports = true      # asyncssh/PTB stubs are not packaged
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
warn_unused_configs = true

# Per-module baseline. Each entry silences only the error codes that module
# ALREADY produces on the base tree (counts in the comment), so the typecheck
# gate is green today and turns red the moment someone adds a NEW finding.
# These modules are orchestrator-owned: the fix is an annotation sweep, not
# something this lane can do. Delete an entry as its module is cleaned up;
# after that, mypy enforces that code for the module again.
[[tool.mypy.overrides]]
module = ["src.bot.admin"]
disable_error_code = ["arg-type", "attr-defined", "index", "union-attr", "var-annotated"]  # 2 + 3 + 9 + 5 + 1

[[tool.mypy.overrides]]
module = ["src.bot.backup"]
disable_error_code = ["index", "union-attr"]  # 2 + 26

[[tool.mypy.overrides]]
module = ["src.bot.commands"]
disable_error_code = ["index", "union-attr"]  # 2 + 33

[[tool.mypy.overrides]]
module = ["src.bot.docker"]
disable_error_code = ["arg-type", "index", "union-attr"]  # 1 + 4 + 27

[[tool.mypy.overrides]]
module = ["src.bot.errors"]
disable_error_code = ["arg-type", "misc", "union-attr"]  # 2 + 2 + 3

[[tool.mypy.overrides]]
module = ["src.bot.files"]
disable_error_code = ["arg-type", "index", "union-attr"]  # 3 + 7 + 36

[[tool.mypy.overrides]]
module = ["src.bot.firewall"]
disable_error_code = ["arg-type", "index", "union-attr"]  # 1 + 4 + 22

[[tool.mypy.overrides]]
module = ["src.bot.monitoring"]
disable_error_code = ["union-attr"]  # 42

[[tool.mypy.overrides]]
module = ["src.bot.navigation"]
disable_error_code = ["union-attr"]  # 8

[[tool.mypy.overrides]]
module = ["src.bot.packages"]
disable_error_code = ["arg-type", "index", "union-attr"]  # 1 + 2 + 22

[[tool.mypy.overrides]]
module = ["src.bot.processes"]
disable_error_code = ["arg-type", "index", "union-attr"]  # 1 + 2 + 22

[[tool.mypy.overrides]]
module = ["src.bot.servers"]
disable_error_code = ["arg-type", "index", "union-attr"]  # 3 + 5 + 55

[[tool.mypy.overrides]]
module = ["src.bot.services"]
disable_error_code = ["index", "union-attr"]  # 4 + 16

[[tool.mypy.overrides]]
module = ["src.bot.shell"]
disable_error_code = ["arg-type", "union-attr"]  # 1 + 16

[[tool.mypy.overrides]]
module = ["src.bot.support"]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "valid-type"]  # 1 + 1 + 1 + 1

[[tool.mypy.overrides]]
module = ["src.bot.system"]
disable_error_code = ["union-attr"]  # 16

[[tool.mypy.overrides]]
module = ["src.config"]
disable_error_code = ["arg-type"]  # 2

[[tool.mypy.overrides]]
module = ["src.database"]
disable_error_code = ["arg-type", "assignment", "unused-ignore"]  # 1 + 4 + 1

[[tool.mypy.overrides]]
module = ["src.health"]
disable_error_code = ["arg-type"]  # 1

[[tool.mypy.overrides]]
module = ["src.logger_config"]
disable_error_code = ["attr-defined"]  # 1

[[tool.mypy.overrides]]
module = ["src.ssh_manager"]
disable_error_code = ["arg-type", "call-arg", "return-value"]  # 1 + 1 + 2

[[tool.mypy.overrides]]
module = ["src.updater"]
disable_error_code = ["unused-ignore"]  # 1

[tool.coverage.run]
source = ["src"]
branch = true
# Honest for the CURRENT tree: the suite measures 55.4% overall because the
# 3.8k-line interaction layer (src/main.py) is integration code that needs a
# live Telegram/SSH environment to exercise. The runtime/jobs/policy/
# observability packages landing in this wave are unit-tested, so the floor
# rises as they land. Ratchet it up as the new packages land; never lower it.
fail_under = 50

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
