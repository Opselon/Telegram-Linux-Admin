# Publishes GitHub Releases with PyInstaller binaries and SHA256 checksums.
#
# PURPOSE / OWNER / CONSUMES / PROVIDES / INVARIANTS / EXTEND
# PURPOSE: build thawed binaries per OS, checksum them, publish one Release.
# OWNER:   ci lane (feat/3.2-ci).
# CONSUMES: packaging/pyinstaller_entry.py, pyproject.toml.
# PROVIDES: linux-amd64 / windows-amd64 / macos-arm64 binaries + sha256sums.txt.
# INVARIANTS: real YAML, no JSON documents, no unquoted emoji, never a
#   step with both `uses` and `run`, and the token only ever arrives from the
#   job environment - it is never echoed or inlined into a command.
# EXTEND: new targets go in the build matrix; keep platform_id in sync with
#   the packaging step that derives artifact names from it.
#
# Replaces the old release-binaries.yml, which was valid only because GitHub
# parsed its JSON contents as YAML and whose curl block embedded a literal
# 'Bearer ***' placeholder and required a MODELS_TOKEN secret for LLM notes.
# This file keeps the same intent (tag push -> release with binaries) using
# GitHub's native release-notes generation instead.

name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (optional, e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Steps use bash on every runner including Windows (git-bash ships with the
# windows-latest image) so one script drives all three builds.
defaults:
  run:
    shell: bash

env:
  APP_NAME: telegram-linux-admin
  MAINTAINER: "Opselon <opselon@users.noreply.github.com>"

jobs:
  build:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS-amd64 was dropped: macos-latest is arm64, the x64 build
          # needed Rosetta to run its own smoke test, and x86 macOS is
          # end-of-life year 2026-11.
          - os: ubuntu-latest
            arch: amd64
            python_arch: x64
            binary_name: telegram-linux-admin-linux-amd64
            platform_id: linux-amd64
          - os: windows-latest
            arch: amd64
            python_arch: x64
            binary_name: telegram-linux-admin-windows-amd64.exe
            platform_id: windows-amd64
          - os: macos-latest
            arch: arm64
            python_arch: arm64
            binary_name: telegram-linux-admin-macos-arm64
            platform_id: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.arch }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.os == 'Windows' && '~\\AppData\\Local\\pip\\Cache' || runner.os == 'Linux' && '~/.cache/pip' || '~/Library/Caches/pip' }}
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Clean dist
        run: rm -rf dist build && mkdir -p dist

      - name: Build executable
        run: >
          pyinstaller --clean --noconfirm --onefile --paths . 
          --hidden-import src --hidden-import src.updater
          --name "${{ matrix.binary_name }}" packaging/pyinstaller_entry.py

      - name: Verify dist contents
        run: |
          set -euo pipefail
          ls -lah dist || true
          test -s "dist/${{ matrix.binary_name }}" \
            || { echo "expected file not found: dist/${{ matrix.binary_name }}"; exit 1; }

      # Only Linux runner has the Python grammar to re-probe the binary.
      - name: Smoke-test the frozen binary
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p smoke && cd smoke
          echo '{"telegram_token": "123456:ABC-DEF1234567890", "whitelisted_users": [12345], "access_mode": "whitelist"}' > config.json
          export SMOKE_TEST=1 SMOKE_TEST_SECONDS=25 TLA_HEALTH_PORT=8087 TLA_AUDIT_DIR="$PWD/var/log"
          TLA_CONFIG_FILE="$PWD/config.json" "../dist/${{ matrix.binary_name }}" > binary.log 2>&1 &
          BIN_PID=$!
          ok=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8087/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          cat binary.log || true
          if [ "$ok" != "1" ]; then echo "Frozen binary never answered /healthz"; exit 1; fi
          curl -fsS http://127.0.0.1:8087/readyz >/dev/null
          kill $BIN_PID 2>/dev/null || true
          echo "Frozen binary smoke test passed."

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform_id }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: Create standard packages
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: bin-*

      - name: Install fpm (deb/rpm)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Get version from tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-manual-${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assemble .deb, .rpm, .zip, .tar.gz
        run: |
          set -euo pipefail
          mkdir -p packages
          VERSION="${{ steps.tag.outputs.VERSION }}"
          for PLATFORM_DIR in binaries/bin-*; do
            [ -d "$PLATFORM_DIR" ] || continue
            PLATFORM=$(basename "$PLATFORM_DIR" | sed 's/bin-//')
            BINARY_PATH=$(find "$PLATFORM_DIR" -type f | head -n 1)
            BINARY_NAME=$(basename "$BINARY_PATH")

            if [[ "$PLATFORM" == *linux-amd64 ]]; then
              fpm -s dir -t deb -n "$APP_NAME" -v "$VERSION" -a amd64 \
                --prefix /usr/local/bin --maintainer "$MAINTAINER" \
                -C "$PLATFORM_DIR" "$BINARY_NAME"
              fpm -s dir -t rpm -n "$APP_NAME" -v "$VERSION" -a x86_64 \
                --prefix /usr/local/bin --maintainer "$MAINTAINER" \
                -C "$PLATFORM_DIR" "$BINARY_NAME"
            fi

            if [[ "$PLATFORM" == *windows* ]]; then
              cp "$BINARY_PATH" "packages/${APP_NAME}_${VERSION}_${PLATFORM}.exe"
            else
              tar -czf "packages/${APP_NAME}_${VERSION}_${PLATFORM}.tar.gz" \
                -C "$PLATFORM_DIR" "$BINARY_NAME"
            fi
          done
          mv ./*.deb ./*.rpm packages/ 2>/dev/null || true

      - name: Generate sha256 checksums
        run: |
          set -euo pipefail
          cd packages
          sha256sum * > sha256sums.txt
          cd ..
          ls -lah packages

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: packages/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, package]
    # `always()` + needs guard: without a reliable build there is nothing to
    # ship, so a failed build skips this job instead of shipping an empty
    # release.
    if: always() && needs.build.result == 'success' && needs.package.result == 'success'
    steps:
      - name: Get tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.0.0-manual-${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Verify checksums exist
        run: |
          set -euo pipefail
          ls -lah release-assets
          test -s release-assets/sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          generate_release_notes: true
          files: |
            release-assets/**
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' || contains(steps.tag.outputs.TAG_NAME, '-') }}
          make_latest: ${{ github.event_name == 'push' && !contains(steps.tag.outputs.TAG_NAME, '-') }}
