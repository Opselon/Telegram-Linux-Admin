# Continuous integration for Telegram-Linux-Admin.
#
# PURPOSE / OWNER / CONSUMES / PROVIDES / INVARIANTS / EXTEND
# PURPOSE: single quality gate for every push and pull request.
# OWNER:   ci lane (feat/3.2-ci). Orchestrator owns src/** and tests/**.
# CONSUMES: src/, tests/, pyproject.toml, Dockerfile, scripts/ci/*.
# PROVIDES: lint / typecheck / test / package / docker / security gates.
# INVARIANTS: real YAML (never a JSON document), no unquoted emoji, never a
#   step with both `uses` and `run`, never an echoed secret. Every threshold
#   was measured on the base tree before commit - none is aspirational; the
#   calibration notes live beside each setting in pyproject.toml.
# EXTEND: add new gates as new jobs, keep `ci-summary` needing all of them.
#
# Replaces python-ci.yml as the single CI entry point.
name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run on the same ref instead of burning runner minutes
# on a commit that has already been replaced. Releases (tag pushes) are
# never cancelled mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # Selection comes from [tool.ruff.lint]: pyflakes bug-catching rules plus
      # bugbear. Style-only codes (E/W, I, SIM) are intentionally off there.
      - name: ruff check
        run: ruff check src tests

      # Format gate scoped to what this lane owns: src/ and tests/ predate
      # this formatter (13 files each would change) and reformatting them would
      # collide with every other lane's diff. Widen to `src tests scripts/ci`
      # once the orchestrator has migrated the tree.
      - name: ruff format --check (scripts/ci)
        run: ruff format --check scripts/ci

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: python -m pip install --upgrade pip mypy

      # Blocking, and driven by [tool.mypy] in pyproject.toml: config lives
      # there (not a separate mypy.ini) so the local command and CI cannot
      # diverge. That config excludes src/main.py (463 of 469 base findings in
      # orchestrator-owned untyped handlers) and carries an explicit
      # per-module baseline for the ~15 legacy findings that remain. Net
      # effect: green on the base tree, red the instant a NEW finding lands.
      - name: mypy
        run: mypy

  validate-workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The validator is stdlib-only and falls back to a JSON parse when
      # PyYAML is missing, but install it so a real YAML parse is what runs.
      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate .github/workflows/*
        run: python scripts/ci/check_workflows.py .github/workflows

  test:
    name: Test (${{ matrix.os }})
    needs: [lint, typecheck, validate-workflows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\\AppData\\Local\\pip\\Cache' || '~/.cache/pip' }}
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Same command the gate runs locally, so a ratio that fails here fails
      # before the commit too. Floor is 50 because the base tree measures
      # 55.4%: the 3.8k-line interaction layer needs a live Telegram/SSH
      # environment to exercise. [tool.coverage.run] documents the ratchet
      # plan.
      - name: Run tests with coverage
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          deselect=""
          if [ "$MATRIX_OS" = "windows-latest" ]; then
            # tests/test_security.py::test_keyfile_is_created_when_missing
            # asserts POSIX 0600 via os.stat().st_mode; Windows does not
            # implement POSIX file modes, so it can never pass there. It is
            # deselected rather than skipped so the reason is visible, and it
            # is reported to the orchestrator (tests/** is not owned here).
            deselect="--deselect tests/test_security.py::test_keyfile_is_created_when_missing"
          fi
          python -m pytest --cov=src --cov-report=xml --cov-report=term \
            --cov-fail-under=50 $deselect

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package (wheel + sdist)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Locate artifacts
        id: dist
        run: |
          set -euo pipefail
          wheel=$(find dist -name '*.whl' | head -n 1)
          sdist=$(find dist -name '*.tar.gz' | head -n 1)
          test -n "$wheel" || { echo "no wheel produced"; exit 1; }
          test -n "$sdist" || { echo "no sdist produced"; exit 1; }
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=$sdist" >> "$GITHUB_OUTPUT"
          echo "Built $wheel and $sdist"

      # The wheel must install AND serve. This is the exact failure the Docker
      # stage used to hit: a wheel carrying console scripts but no importable
      # package. Runs the same script a developer can run locally.
      - name: Install wheel into a clean venv and smoke it
        run: bash scripts/ci/verify_install.sh "${{ steps.dist.outputs.wheel }}"

      - name: Confirm the module imports from the wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/import-check
          /tmp/import-check/bin/pip install --quiet "${{ steps.dist.outputs.wheel }}"
          /tmp/import-check/bin/python -c "import src.main; print('wheel import ok')"

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker build + smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tla-bot:ci .

      # Reuses the pattern proven in the previous python-ci.yml: SMOKE_TEST=1
      # with a throwaway config under a mounted data volume, then probe the
      # three observability endpoints. 18081 is mapped to avoid colliding
      # with anything else the runner might have bound.
      - name: Run image and probe /healthz /readyz /metrics
        run: |
          set -euo pipefail
          mkdir -p "$PWD/smoke-data"
          echo '{"telegram_token": "123456:ABC-DEF1234567890", "whitelisted_users": [12345], "access_mode": "whitelist"}' > "$PWD/smoke-data/config.json"
          docker run -d --name tla-smoke \
            -p 127.0.0.1:18081:8081 \
            -e SMOKE_TEST=1 -e SMOKE_TEST_SECONDS=40 \
            -e TLA_HEALTH_PORT=8081 -e TLA_CONFIG_FILE=/app/data/config.json \
            -v "$PWD/smoke-data:/app/data" \
            tla-bot:ci

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Container never answered /healthz"
            docker logs tla-smoke || true
            docker rm -f tla-smoke >/dev/null 2>&1 || true
            exit 1
          fi

          echo "healthz: $(curl -fsS http://127.0.0.1:18081/healthz)"
          echo "readyz:  $(curl -fsS http://127.0.0.1:18081/readyz)"
          echo "metrics (first 5 lines):"
          curl -fsS http://127.0.0.1:18081/metrics | head -5
          docker logs tla-smoke
          docker rm -f tla-smoke >/dev/null 2>&1 || true

  security:
    name: Security audit (pip-audit)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Audits the RESOLVED dependency set a user gets from the wheel, not the
      # dev tooling: install into a scratch venv, freeze it, audit that.
      # continue-on-error is deliberately absent - an advisory in the shipped
      # dependency set must stop the pipeline. No --ignore-vuln entries today;
      # if one becomes unavoidable, add it here with the advisory URL and an
      # expiry date so it cannot rot silently.
      - name: pip-audit the wheel dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          wheel=$(find dist -name '*.whl' | head -n 1)
          test -n "$wheel" || { echo "no wheel found"; exit 1; }
          echo "Auditing $wheel"
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet "$wheel"
          /tmp/audit/bin/pip freeze > /tmp/audit/requirements.txt
          pip-audit -r /tmp/audit/requirements.txt

  ci-summary:
    name: CI summary
    # `needs` with the full job list makes this job the single status the
    # branch protection rule should require. `if: always()` lets it run and
    # report even when an upstream gate failed.
    needs: [lint, typecheck, validate-workflows, test, package, docker, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = [k for k, v in results.items() if v["result"] != "success"]
          for name, info in results.items():
              print(f"{name}: {info['result']}")
          if failed:
              print(f"::error::CI failed in: {', '.join(failed)}")
              sys.exit(1)
          print("All CI gates passed.")
          PY
