# Security pipeline: static analysis, secret scanning, supply-chain review,
# container scanning and SBOM generation.
#
# Jobs:
#   codeql            — GitHub's SAST for python (weekly + pushes + PRs)
#   gitleaks          — secret-leak scan over full git history
#   dependency-review — fail PRs that introduce vulnerable/malicious deps
#   trivy             — container image vulnerability/config scan
#   sbom              — CycloneDX SBOM of the built wheel, uploaded per run
#
# All jobs are blocking; the gitleaks history scan is what would have caught
# a committed bot token before it leaked.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:20 UTC scan cadence (staggered off the hour).
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  codeql:
    name: CodeQL (python SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: security-codeql

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so leaked secrets in old commits are found
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, AGPL-3.0-or-later

  trivy:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t tla-bot:security-scan .
      # Report-only for now: base-image CVEs (Debian/python-slim) would keep
      # a blocking gate red from day one. Findings still land in the Security
      # tab via the SARIF upload below; flip exit-code to "1" to enforce once
      # the current findings are triaged.
      - name: Trivy vulnerability + config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tla-bot:security-scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + cyclonedx
        run: |
          python -m pip install --upgrade pip
          pip install . cyclonedx-bom
      - name: Generate SBOM from the installed environment
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90
